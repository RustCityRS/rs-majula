[alias]
unpack = "run -p rs-pack -- unpack -e expected -o content_unpack"
verify = "run -p rs-pack -- verify -e expected -u content_unpack"
pack-tga = "run -p rs-pack -- from-pyxel"
unpack-tga = "run -p rs-pack -- to-pyxel"

world1 = "run -p rs-server --profile dev-opt -- --node-id 10 --cluster world10@127.0.0.1,world11@127.0.0.1"
world2 = "run -p rs-server --profile dev-opt -- --node-id 11 --cluster world10@127.0.0.1,world11@127.0.0.1"
# Release builds against the local database: the dev secrets go in as flags because release refuses to default them.
world1-release = "run -p rs-server --release -- --node-id 10 --cluster world10@127.0.0.1,world11@127.0.0.1 --db-pass password --pepper localhost --cookie rs_secret --admin-secret rs_admin --auto-register true --auto-migrate true"
world2-release = "run -p rs-server --release -- --node-id 11 --cluster world10@127.0.0.1,world11@127.0.0.1 --db-pass password --pepper localhost --cookie rs_secret --admin-secret rs_admin --auto-register true --auto-migrate true"

[env]
REV = "289"

[build]
target-dir = "target"
rustflags = ["-C", "target-cpu=native"]

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-cpu=native", "-C", "link-arg=/STACK:8388608"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
overflow-checks = false

[profile.dev]
opt-level = 0
debug = 2

[profile.dev-opt]
inherits = "dev"
opt-level = 2
