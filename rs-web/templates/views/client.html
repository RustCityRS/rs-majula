<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=0.6, shrink-to-fit=no">
    <meta name="color-scheme" content="light only">
    <title>World {{ world.id }} | RuneScape Game</title>

    <style>
        html {
            touch-action: manipulation;
        }

        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            background-color: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }

        a {
            color: white;
            text-decoration: underline;
            cursor: pointer;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            flex-direction: column;
            overflow: hidden;
        }

        .gameframe-top {
            vertical-align: top;
            display: inline-block;
            text-align: center;
            padding-top: 5px;
        }

        /* The game page scrolls inside it, so a 2x or 3x client still fits. */
        .gameframe {
            display: flex;
            flex-grow: 1;
            width: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        nav {
            background: url('/img/tileddarkstoneback.gif') repeat;
            max-width: 765px;
            margin: 0 auto;
        }

        .nav-inner {
            display: grid;
            grid-template-columns: repeat(5, auto);
        }

        nav a, nav .community {
            display: inline-block;
            height: 24px;
            line-height: 26px;
            text-decoration: none;
            color: white;
            font-size: 13px;
            font-weight: bold;
            border-right: 2px solid #484848;
        }

        nav a:first-of-type {
            border-left: 2px solid #484848;
        }

        nav .community {
            cursor: default;
            display: inline;
            position: relative;
        }

        nav a:hover, nav .community:hover {
            background: url('/img/title/tiledshinystonered.jpg') repeat;
        }

        .community-links {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            list-style: none;
            width: 100%;
            margin: 0;
            padding: 0;
            border-top: 2px solid #373737;
        }

        .community-links li {
            display: block;
        }

        .community-links a {
            display: block;
            background: black url('/img/tileddarkerstoneback.gif') repeat;
            border: 2px solid #373737;
            border-top: none;
            height: 32px;
            line-height: 32px;
        }

        .community:hover .community-links {
            display: block;
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            display: none;
            fill: white;
            margin: 4px auto 0;
        }

        .screens-bigly {
            display: none;
        }

        @media (max-width: 399px) {
            .nav-icon {
                display: block;
            }

            .nav-text {
                display: none;
            }

            nav a, nav .community {
                height: 36px;
                line-height: 36px;
            }

            .community-links {
                width: 140px;
                right: -2px;
            }
        }

        @media (min-width: 765px) {
            .screens-bigly {
                display: inline-block;
            }

            nav .community {
                display: none;
            }

            .nav-inner {
                display: grid;
                grid-template-columns: repeat(7, auto);
            }
        }
    </style>

    <script>
        function confirmNavigation(e, href) {
            if (e == null) e = event;
            var response = window.confirm("Clicking this link will exit the game.\nPlease log out of the game before exiting.\nClick OK if you have safely logged out.");
            if (response) document.location.href = href;
            if (e.cancelable) e.preventDefault();
            return false;
        }
    </script>
</head>
